# Fly.io config: https://fly.io/docs/reference/configuration/
# `fly launch --no-deploy --copy-config`, then `fly secrets set ...`, then `fly deploy`.
app = "crowd-kit" # must be globally unique: change it if `fly launch` says it's taken
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # CROWDKIT_DEMO = "1" # keyless fallback with canned data

[http_service]
  internal_port = 3000
  force_https = true
  # Always keep one machine running so judges never hit a cold start
  # (the qloo mcp child process stays warm too).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Optional persistent cache: `fly volumes create crowdkit_cache --size 1`, then uncomment.
# The volume is root-owned; the app runs as uid 1000, so also set a startup chown
# or leave this off (cache then stays in memory).
# [mounts]
#   source = "crowdkit_cache"
#   destination = "/app/.cache"
